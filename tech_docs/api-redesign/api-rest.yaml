openapi: 3.1.0
info:
  title: HERMES station API
  version: 2.0.0-draft.1
  summary: REST API of a HERMES station, served by hermes-radio-daemon.
  description: |
    **Tentative proposal, 2026-10-09.** Defines the future architecture; nothing here is
    implemented yet.

    hermes-radio-daemon is the station's backend: it controls the radio, includes
    Mercury (the modem) and serves this REST API and the `hermes.v1` WebSocket
    (`api-ws.yaml`, same folder) on one port. It is the only service the network
    reaches; there is no proxy in front. Its C core does the I/O; the handlers are Go,
    built into it. It replaces hermes-api (PHP) route by route; today's `/api` keeps
    working until no released UI uses it.

    It must run on every Raspberry Pi from 1 GB to 16 GB; the 1 GB Pi sets the budget.

    ## Conventions

    - JSON in and out, `snake_case`, real booleans and numbers.
    - Timestamps are ISO 8601 in UTC (`2026-10-09T14:03:00Z`). Frequencies are integer Hz.
    - Collections return `{"data": [...], "next_cursor": "..."}` and take `limit`
      (default 50, maximum 200) and `cursor`. `next_cursor` is absent on the last page.
    - Create returns 201 with the object; update is `PATCH` with only the fields that
      change; delete returns 204.
    - Errors are `application/problem+json` (RFC 9457) with a stable string `code`.
    - Actions that are not a change to one resource are `POST` to a verb under it
      (`POST /system/reboot`). No GET changes anything.
    - No secret travels in a URL: passphrases go in bodies or the `X-Hermes-Passphrase`
      header.
    - `x-hermes-role` on an operation is the lowest role that may call it:
      `readonly` < `user` < `operator` < `admin`. A role check failure is 403.
      `readonly` sees what `user` sees and changes nothing but its own sessions and read
      marks (observers, trainees).
    - Every response carries `X-Request-Id`. A client may send its own (up to 64
      characters), and it is echoed back; otherwise the station makes one. Errors repeat it
      as `request_id`, and the station's logs use it, so a report can be traced.
    - Text meant for people (`title`, `detail`) follows the user's `locale`, or
      `Accept-Language` before login.

    ## Security

    A station's Wi-Fi is open to its community, so the API assumes anyone can reach it.

    - **Logins.** Sessions are opaque tokens stored only as hashes. The cookie is
      `HttpOnly; Secure; SameSite=Strict`. Failed logins are limited to 5 a minute per
      address (429, `rate_limited`).
    - **CSRF.** A request that changes anything (`POST`, `PUT`, `PATCH`, `DELETE`) made
      with the session cookie must carry an `Origin` header naming this station, or the
      `X-Hermes-CSRF: 1` header; otherwise 403 `csrf`. Requests authenticated with
      `Authorization: Bearer` are exempt, since browsers never add that header by
      themselves.
    - **First boot.** `/setup` needs the one-time setup code the installer writes to the
      console and to `/etc/hermes/setup-code` (root only). Anyone on the Wi-Fi could
      otherwise claim a new station before its owner does.
    - **Encryption on the air** is not allowed on amateur bands. Passphrase-encrypted
      messages and attachments, and D-STAR encrypted voice, are refused (403
      `encryption_not_allowed`) unless an admin turns them on in `settings.encryption`
      for a station licensed to use them. Reticulum encrypts everything it carries, so it
      can't run at all until `settings.encryption.reticulum` is on. All default to off.
    - **Transmissions are accountable.** Only `operator` and above control the radio
      directly (PTT, digital modes, transmit audio). Users send messages, by UUCP or by
      broadcast, and the station transmits them; that is rate-limited per user. Every
      transmission is in the audit log (`GET /events`, action `radio.tx`): who, mode,
      frequency, text, start and end, whether or not a broadcast names its author on the
      air.
    - **Text from other stations is untrusted.** Anyone can transmit, so everything that
      arrives over the air is data, never markup: incoming message subjects and bodies,
      attachment names, decoded FT8, CW, RTTY and D-STAR text, chat lines and decoded
      callsigns. The station removes control characters, enforces the length limits in
      the schemas and always emits valid JSON; clients render it as plain text. Callsigns
      decoded off the air are claims, not identities.
    - **A message's origin** is the UUCP system that delivered it, never the sender field
      inside the `.hmp` file, and the station never stores fields from that file beyond
      the ones it maps. A broadcast has no delivering system, so its origin is the station
      whose signature it carries: NNCP's for an encrypted broadcast, the broadcast
      header's for a plain one (signing doesn't hide anything, so it is allowed on
      amateur bands). A broadcast whose signature doesn't check against a known station
      is dropped, unless its area has `allow_unknown`; then `origin` is null and the
      named sender is kept only as `claimed_origin`, a claim.
    - **LXMF senders** are their signing identity's address. A message whose signature
      is wrong is dropped. One from an identity the station hasn't heard announce yet is
      kept with `lxmf.from.verified` false. Display names from announces are claims.
    - **The Reticulum services are open to the Wi-Fi.** Phones on the station's network
      may use its transport and propagation nodes without an account, as Reticulum
      expects; the propagation node's storage is capped
      (`reticulum.settings.propagation.storage_limit_mb`), and only accounts get an LXMF
      address or the HERMES inbox.
    - **The process.** hermes-radio-daemon runs as an unprivileged user with only the
      real-time, audio and device rights it needs, under systemd sandboxing. System
      actions (reboot, Wi-Fi, mailboxes, UUCP) go through a privileged helper with a fixed
      set of verbs and validated arguments; no user input ever reaches a shell. HTTP, JSON
      and WebSocket parsing is fuzzed.
    - **Failsafe.** If the backend stops while transmitting, a watchdog unkeys the radio.
    - **TLS and limits.** The backend terminates TLS itself, and caps request and header
      sizes, times out slow clients and caps connections. Each station should have its
      own key: a key shared by every station image is not secret.

    ## Choices where the two earlier proposals differ

    | Topic | README (hermes-api v2) | hermes-backend | This spec | Why |
    | --- | --- | --- | --- | --- |
    | Base path | `/api/v2` | `/api/v1` | `/api/v2` | `/api` and `/api/v1` already mean today's routes on stations |
    | Field case | `snake_case` | `camelCase` | `snake_case` | Matches radiod's and Mercury's existing JSON and the C code that emits it |
    | Auth | Cookie session + nginx | JWT RS256 + refresh | Opaque session token, as a cookie for browsers or `Authorization: Bearer` for tools | One process holds the session table, so revocation is a row delete; no signing keys to manage on a 1 GB Pi |
    | Login id | username (mailbox) | callsign | `username` (the mailbox name) | Users are people at a station; the callsign belongs to the station (`GET /system`) |
    | Messages | inbox/outbox + per-recipient rows | conversations | Messages with per-recipient delivery; `GET /messages?peer=` gives a conversation view | The UUCP `.hmp` and mail model is per message and per destination; a conversation is a filter over it |
    | Errors | problem+json with `errors` | problem+json with `code` | problem+json with both `code` and `errors` | Machines branch on `code`, forms show `errors` |
    | Radio control | WebSocket only | REST through a CLI | Saved settings and state in REST; live control, PTT and streams on the WebSocket | PTT must be released when its client disappears, which only a socket can tell |
    | Roles | 3 | 4, flat (each route lists every role) | 4 (`readonly` added), ordered | Adopted `readonly`; an order keeps every route to one role |
    | Request ids | none | `requestId` | `X-Request-Id`, and `request_id` in errors | Adopted |
    | Language | station setting | per user (`locale`) | per user, station default | Adopted |
    | Sessions | none | list and revoke your own | `GET /sessions`, `DELETE /sessions/{id}` | Adopted |
    | First boot | installer only | `/setup` wizard | `/setup`, once, before any user exists | Adopted; the UUCP name and mail domain stay installer-set, so the wizard can't break the network maps |
    | Apps | none | `/apps` install, remove, update | `/apps` registry, enable and disable | Adopted the registry; installing stays with the Debian packages |
    | Delivery | per-recipient UUCP state | per-recipient, per-channel, with acknowledgements | per-recipient UUCP state, plus read state | Adopted local read state; read receipts between stations wait until no station needs the old `.hmp` format |
    | Reticulum | — | — | With NNCP, the encrypted option for communication. The station is a Reticulum transport and LXMF propagation node for phones on its Wi-Fi, reaches other stations over Mercury ARQ (one backhaul link per station, calls like UUCP's), and is an LXMF client: each user has an address, and LXMF is a third message channel | Mercury's ARQ carries Reticulum where its broadcast plane can't (frame size, one client); calls are intermittent, so the propagation node holds messages like the UUCP spool |
    | Broadcast | — | a conversation type, up to 200 recipients | A message to an **area** (NNCP's multicast group), sent on Mercury's broadcast plane as a RaptorQ carousel in a mode chosen per message: an NNCP area bundle when encrypted, a signed plain object otherwise | One transmission reaches every station listening in that mode, with no return path; NNCP areas already name the group, identify the message and authenticate the sender |
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: https://{station}/api/v2
    variables:
      station:
        default: station.hermes.radio
        description: The station's hostname or address on its local network.
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: session
    description: Logging in and out.
  - name: users
    description: People with an account (and a mailbox) on this station.
  - name: messages
    description: |
      HERMES messages exchanged with other stations over UUCP, broadcast to every
      station listening, or exchanged with any LXMF address over Reticulum.

      **LXMF.** A message with `lxmf` instead of `recipients` goes from the sender's own
      LXMF address (or the station's) to one or more LXMF addresses: Sideband, NomadNet
      or MeshChat users, or users of other stations. Each recipient has its own LXMF
      delivery state, and `delivered` is a real receipt from the recipient.

      **Broadcast.** A message with `broadcast` instead of `recipients` goes to an area
      (`GET /areas`) on Mercury's broadcast plane, as a RaptorQ fountain carousel in
      Mercury's broadcast wire format (mercury `docs/BROADCAST-WIRE-FORMAT.md`). radiod's
      messaging layer runs the carousel in-process with Mercury's own carousel code.
      Any station listening in the same mode decodes it, even one that tunes in halfway
      through, and nobody acknowledges it. There is no negotiation on the broadcast plane:
      the sender picks the mode (`broadcast.mode`, by default the station's
      `modem.config.listen_mode`), and only stations listening in that mode hear it.

      With `broadcast.encrypt`, the message is encrypted to the area as an NNCP area
      packet; otherwise it goes out in the clear, signed. Either way a receiver keeps one
      copy per broadcast, however many passes or paths bring it, and an encrypted one
      that a station missed can still reach it later through NNCP relaying over ARQ.
      The wire format is in `broadcast.md`, same folder.
  - name: attachments
    description: Files attached to messages.
  - name: stations
    description: Stations this one can reach, from the UUCP configuration; their last-known positions are served by `/gps/stations`.
  - name: areas
    description: Broadcast groups (NNCP multicast areas), from the station's configuration.
  - name: reticulum
    description: |
      The station's Reticulum node: a transport and LXMF propagation node for phones on
      its Wi-Fi, with backhaul links to other stations over Mercury ARQ. LXMF messages
      themselves are messages (`channel` = `lxmf`). See `reticulum.md`, same folder.
  - name: schedules
    description: When the station calls the others.
  - name: queue
    description: The UUCP spool.
  - name: radio
    description: Radio state and saved profiles; live control is on the WebSocket.
  - name: modem
    description: Mercury, the HF modem.
  - name: system
    description: Station identity, health, settings and power.
  - name: logs
    description: Mail and UUCP logs.
  - name: wifi
    description: The station's access point.
  - name: gps
    description: Position, the station's recorded trips (breadcrumbs), and the last-known positions of other stations for the map.
  - name: events
    description: Audit log.
  - name: digi
    description: Digital-mode traffic (FT8, CW, RTTY, D-STAR) sent and heard by the radio.
  - name: setup
    description: First-boot setup.
  - name: apps
    description: The station's frontend apps.

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and component health (no login needed).
      security: []
      responses:
        "200":
          description: Healthy or degraded; see `status`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}

  /setup:
    get:
      tags: [setup]
      operationId: getSetupStatus
      summary: Whether the first-boot setup has been done (no login needed).
      security: []
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SetupStatus"}
    post:
      tags: [setup]
      operationId: runSetup
      summary: First-boot setup, once.
      description: |
        Accepted only until setup is completed, while no user but the installer's `root`
        exists, and only with the one-time `setup_code` that the installer shows on the
        console and writes to `/etc/hermes/setup-code`. Five wrong codes lock setup for 10
        minutes. Creates the first admin, names the station and sets its language, time
        zone, first radio profile and enabled apps. The UUCP name and mail domain are set
        by the installer and are not changed here.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetupRequest"}
      responses:
        "201":
          description: Done; the new admin is logged in.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "403":
          description: Wrong setup code (`code` = `bad_setup_code`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "409":
          description: Setup was already done (`code` = `setup_done`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/Invalid"}

  /session:
    post:
      tags: [session]
      operationId: login
      summary: Log in.
      description: |
        Sets the `hermes_session` cookie and also returns the token, for tools that use
        `Authorization: Bearer`. Failed logins are limited to 5 a minute per address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "201":
          description: Logged in.
          headers:
            Set-Cookie:
              description: "`hermes_session=<token>; HttpOnly; Secure; SameSite=Strict; Path=/`"
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
    get:
      tags: [session]
      operationId: getSession
      summary: Who am I.
      x-hermes-role: readonly
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    delete:
      tags: [session]
      operationId: logout
      summary: Log out (ends this session only).
      x-hermes-role: user
      responses:
        "204": {description: Logged out.}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /sessions:
    get:
      tags: [session]
      operationId: listMySessions
      summary: Your open sessions (admins may pass `user_id`).
      x-hermes-role: readonly
      parameters:
        - name: user_id
          in: query
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Sessions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/SessionInfo"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: {type: integer, format: int64}
    delete:
      tags: [session]
      operationId: revokeSession
      summary: End one of your sessions (admins may end anyone's).
      x-hermes-role: readonly
      responses:
        "204": {description: Ended.}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users.
      x-hermes-role: admin
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserPage"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user and their mailbox.
      description: Also creates the Postfix/Dovecot mailbox through the station's `email_create_user` helper.
      x-hermes-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserCreate"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Invalid"}
  /users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUser
      summary: A user (admins, or the user themselves).
      x-hermes-role: readonly
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [users]
      operationId: updateUser
      summary: Change a user (admins; users may change their own display name, phone and location).
      x-hermes-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserPatch"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user and their mailbox (`root` cannot be deleted).
      x-hermes-role: admin
      responses:
        "204": {description: Deleted.}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /users/{user_id}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [users]
      operationId: setPassword
      summary: Set a password (the user, with the current one; or an admin). Updates the mailbox too.
      x-hermes-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordChange"}
      responses:
        "204": {description: Changed. Other sessions of that user end.}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Invalid"}
  /users/{user_id}/avatar:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [users]
      operationId: setAvatar
      summary: Set or replace a user's avatar (the user themselves, or an admin).
      description: |
        The image is recompressed and stored as the user's avatar. A user may set their
        own avatar; an admin may set anyone's.
      x-hermes-role: user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: An image (JPEG, PNG or WebP); recompressed on upload.
      responses:
        "200":
          description: Updated; `avatar` carries the new URL.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "413": {$ref: "#/components/responses/TooLarge"}
    delete:
      tags: [users]
      operationId: removeAvatar
      summary: Remove a user's avatar.
      x-hermes-role: user
      responses:
        "204": {description: "Removed; `avatar` is null."}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /users/{user_id}/lxmf-identity/export:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: exportLxmfIdentity
      summary: Export your LXMF identity, to use the same address in Sideband or another LXMF client.
      description: |
        Only for yourself, never for another user (an admin included), and only with your
        current password. The key is in the format Sideband's identity import takes:
        Base32 of the Reticulum identity's private key. Whoever holds it controls the
        address, so the reply is `Cache-Control: no-store` and the export goes in the
        audit log (`lxmf.identity_export`).
      x-hermes-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, format: password, writeOnly: true}
      responses:
        "200":
          description: The identity.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                type: object
                required: [address, identity_base32]
                properties:
                  address: {$ref: "#/components/schemas/LxmfAddress"}
                  identity_base32: {type: string, description: Base32 of the private key; paste it into Sideband's identity import.}
        "403":
          description: Not your own identity, or a wrong password (`code` = `forbidden`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "409":
          description: The user has no LXMF address yet (`code` = `reticulum_off`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429": {$ref: "#/components/responses/TooManyRequests"}

  /users/{user_id}/devices:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: listDevices
      summary: A user's registered devices (admins, or the user themselves).
      x-hermes-role: user
      responses:
        "200":
          description: Devices, without push tokens.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Device"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [users]
      operationId: registerDevice
      summary: Register a device for push notifications.
      description: A user registers their own device; an admin may register anyone's.
      x-hermes-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeviceCreate"}
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
  /users/{user_id}/devices/{device_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - name: device_id
        in: path
        required: true
        schema: {type: integer, format: int64}
    delete:
      tags: [users]
      operationId: unregisterDevice
      summary: Remove a device (the user's own, or any for an admin).
      x-hermes-role: user
      responses:
        "204": {description: Removed.}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /messages:
    get:
      tags: [messages]
      operationId: listMessages
      summary: Messages, newest first.
      x-hermes-role: readonly
      parameters:
        - name: box
          in: query
          schema: {type: string, enum: [inbox, outbox, drafts, all], default: all}
        - name: peer
          in: query
          description: Only messages from or to this station (`uucp_name`) — the conversation view.
          schema: {$ref: "#/components/schemas/UucpName"}
        - name: channel
          in: query
          description: Only UUCP messages, or only broadcasts.
          schema: {$ref: "#/components/schemas/MessageChannel"}
        - name: area
          in: query
          description: Only broadcasts to this area.
          schema: {$ref: "#/components/schemas/AreaName"}
        - name: address
          in: query
          description: Only LXMF messages from or to this address — the conversation view.
          schema: {$ref: "#/components/schemas/LxmfAddress"}
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/MessageStatus"}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Messages, without bodies.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessagePage"}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [messages]
      operationId: createMessage
      summary: Store a draft.
      description: |
        A draft has exactly one of `recipients` (UUCP), `broadcast` (an area) or `lxmf`
        (LXMF addresses).
      x-hermes-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MessageCreate"}
      responses:
        "201":
          description: Draft stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "403":
          description: |
            Attachments are not allowed for this role (`settings.allow_attachments_role`,
            `code` = `forbidden`), or a passphrase was given while
            `settings.encryption.messages` is off (`code` = `encryption_not_allowed`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/Invalid"}
  /messages/{message_id}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    get:
      tags: [messages]
      operationId: getMessage
      summary: A message with its body.
      x-hermes-role: readonly
      responses:
        "200":
          description: The message with its body (ciphertext stays hidden when `body_encrypted`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [messages]
      operationId: updateDraft
      summary: Change a draft (only while `status` is `draft`).
      x-hermes-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MessagePatch"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: Delete a message; queued UUCP jobs for it are cancelled, and a broadcast of it is stopped.
      x-hermes-role: user
      responses:
        "204": {description: Deleted.}
        "404": {$ref: "#/components/responses/NotFound"}
  /messages/{message_id}/send:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [messages]
      operationId: sendMessage
      summary: Queue a draft to each recipient (one UUCP job per recipient), or for broadcast.
      description: |
        Safe to retry; recipients already queued are left as they are, and a broadcast
        already queued or on the air is left as it is.

        An LXMF message is handed to the LXMF router, one LXMF message per recipient; each
        recipient's `state` follows it, up to `delivered`. A recipient reached only
        through a backhaul link waits in the propagation node until that link is up.

        A broadcast goes out in its `broadcast.mode` for `broadcast.cycles` passes of the
        carousel; follow it on the `messages` topic, and the modem's side on
        `modem.status.broadcast`. ARQ comes first: a broadcast waits (`waiting_arq`) while
        an ARQ session holds the modem, and an ARQ session that starts while it is on the
        air stops it (`preempted`). It goes on the air again once the link is idle; whether
        it resumes or starts its carousel over is up to Mercury (open).

        Mercury sends broadcast frames only in its listen mode, so for a broadcast in
        another mode radiod switches the listen mode to it and back afterwards. Meanwhile
        the station hears no broadcasts in its usual listen mode.
      x-hermes-role: user
      responses:
        "200":
          description: Queued; `recipients` carries each one's state and job id, or `broadcast` its state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "403":
          description: |
            The draft is encrypted (a passphrase, or `broadcast.encrypt`) and
            `settings.encryption.messages` is off (`code` = `encryption_not_allowed`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429":
          description: The user has sent `settings.tx_rate_limit.broadcasts_per_hour` broadcasts this hour (`code` = `rate_limited`).
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "507":
          description: The UUCP spool for a recipient is full (`code` = `spool_full`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /messages/{message_id}/stop:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [messages]
      operationId: stopBroadcast
      summary: Stop a broadcast at the next frame boundary.
      description: |
        `broadcast.state` becomes `stopped`. radiod stops handing frames to Mercury;
        frames Mercury has already queued still go out. A broadcast still waiting for the
        modem is taken out of the line. With `withdraw`, the station also sends a short cancel
        object to the area: receivers drop a partial decode, and mark a copy they already
        decoded as withdrawn (`broadcast.withdrawn_at`).

        Its author may stop or withdraw it; anyone else needs `operator` (403 `forbidden`).
      x-hermes-role: user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                withdraw: {type: boolean, default: false}
      responses:
        "200":
          description: Stopped.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Not a broadcast, or not waiting or on the air (`code` = `not_broadcasting`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /messages/{message_id}/decrypt:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [messages]
      operationId: decryptMessage
      summary: Decrypt an encrypted body with its passphrase (nothing is stored).
      x-hermes-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Passphrase"}
      responses:
        "200":
          description: The plain body.
          content:
            application/json:
              schema:
                type: object
                required: [body]
                properties:
                  body: {type: string}
        "422":
          description: Wrong passphrase (`code` = `bad_passphrase`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  /messages/{message_id}/read:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    put:
      tags: [messages]
      operationId: markRead
      summary: Mark an incoming message as read by you.
      x-hermes-role: readonly
      responses:
        "200":
          description: Marked; `read_at` is set.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [messages]
      operationId: markUnread
      summary: Mark it unread again.
      x-hermes-role: readonly
      responses:
        "204": {description: Marked unread.}
        "404": {$ref: "#/components/responses/NotFound"}

  /messages/{message_id}/reactions:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    put:
      tags: [messages]
      operationId: setReaction
      summary: Set or replace your reaction (an emoji) on a message — one per user.
      x-hermes-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: {type: string, maxLength: 16}
      responses:
        "200":
          description: Set (replacing any earlier one); the message with its reactions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      tags: [messages]
      operationId: removeReaction
      summary: Remove your reaction from a message.
      x-hermes-role: user
      responses:
        "204": {description: Removed.}
        "404": {$ref: "#/components/responses/NotFound"}

  /attachments:
    post:
      tags: [attachments]
      operationId: uploadAttachment
      summary: Upload a file before attaching it to a draft.
      description: |
        Images are recompressed (VVC) and audio encoded (LPCNet) for HF unless `codec` is
        `none`. With a passphrase the stored file is encrypted, which needs
        `settings.encryption.messages`.
      x-hermes-role: user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                passphrase: {type: string, writeOnly: true}
                codec: {$ref: "#/components/schemas/Codec"}
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Attachment"}
        "403":
          description: A passphrase was given while `settings.encryption.messages` is off (`code` = `encryption_not_allowed`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "413": {$ref: "#/components/responses/TooLarge"}
  /attachments/{attachment_id}:
    parameters:
      - name: attachment_id
        in: path
        required: true
        schema: {type: integer, format: int64}
    get:
      tags: [attachments]
      operationId: downloadAttachment
      summary: Download an attachment, decoded back to a common format.
      x-hermes-role: readonly
      parameters:
        - name: X-Hermes-Passphrase
          in: header
          description: Required when the attachment is encrypted.
          schema: {type: string}
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        "404": {$ref: "#/components/responses/NotFound"}
        "422":
          description: Missing or wrong passphrase (`code` = `bad_passphrase`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
    delete:
      tags: [attachments]
      operationId: deleteAttachment
      summary: Delete an attachment that no sent message uses.
      x-hermes-role: user
      responses:
        "204": {description: Deleted.}
        "409": {$ref: "#/components/responses/Conflict"}

  /stations:
    get:
      tags: [stations]
      operationId: listStations
      summary: The stations this one can reach, from `/etc/uucp/sys`.
      x-hermes-role: readonly
      responses:
        "200":
          description: Stations.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Station"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /stations/{uucp_name}:
    parameters:
      - name: uucp_name
        in: path
        required: true
        schema: {$ref: "#/components/schemas/UucpName"}
    get:
      tags: [stations]
      operationId: getStation
      summary: A station.
      x-hermes-role: readonly
      responses:
        "200":
          description: The station.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Station"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [stations]
      operationId: updateStation
      summary: Change alias, frequency, mode or enabled. The UUCP configuration itself is never written.
      x-hermes-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StationPatch"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Station"}
        "422": {$ref: "#/components/responses/Invalid"}

  /areas:
    get:
      tags: [areas]
      operationId: listAreas
      summary: The areas this station can broadcast to.
      description: |
        Read-only: areas, their members and their keys are set up by the installer
        (`hermes-nncp-area-export` hands an area's keys to its stations), so the API never
        writes them.
      x-hermes-role: readonly
      responses:
        "200":
          description: Areas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Area"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /areas/{area}:
    parameters:
      - name: area
        in: path
        required: true
        schema: {$ref: "#/components/schemas/AreaName"}
    get:
      tags: [areas]
      operationId: getArea
      summary: An area.
      x-hermes-role: readonly
      responses:
        "200":
          description: The area.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Area"}
        "404": {$ref: "#/components/responses/NotFound"}

  /reticulum:
    get:
      tags: [reticulum]
      operationId: getReticulum
      summary: The Reticulum node's state.
      x-hermes-role: readonly
      responses:
        "200":
          description: State.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReticulumStatus"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /reticulum/settings:
    get:
      tags: [reticulum]
      operationId: getReticulumSettings
      summary: The Reticulum node's settings.
      x-hermes-role: operator
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReticulumSettings"}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [reticulum]
      operationId: updateReticulumSettings
      summary: Change the Reticulum node's settings.
      x-hermes-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReticulumSettings"}
      responses:
        "200":
          description: Applied and saved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReticulumSettings"}
        "403":
          description: "`enabled` while `settings.encryption.reticulum` is off (`code` = `encryption_not_allowed`)."
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/Invalid"}
  /reticulum/links:
    get:
      tags: [reticulum]
      operationId: listReticulumLinks
      summary: Backhaul links to other stations, over Mercury ARQ.
      x-hermes-role: readonly
      responses:
        "200":
          description: Links.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/ReticulumLink"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /reticulum/links/{uucp_name}:
    parameters:
      - name: uucp_name
        in: path
        required: true
        description: The station at the other end, as in `/stations`.
        schema: {$ref: "#/components/schemas/UucpName"}
    get:
      tags: [reticulum]
      operationId: getReticulumLink
      summary: A backhaul link.
      x-hermes-role: readonly
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReticulumLink"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [reticulum]
      operationId: putReticulumLink
      summary: Set up, or change, the backhaul link to a station.
      x-hermes-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReticulumLinkWrite"}
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReticulumLink"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      tags: [reticulum]
      operationId: deleteReticulumLink
      summary: Remove the backhaul link to a station; a session in progress is closed.
      x-hermes-role: admin
      responses:
        "204": {description: Removed.}
        "404": {$ref: "#/components/responses/NotFound"}
  /reticulum/peers:
    get:
      tags: [reticulum]
      operationId: listLxmfPeers
      summary: LXMF addresses this station has heard announce, newest first.
      description: The address book for writing LXMF messages. Display names are claims.
      x-hermes-role: readonly
      parameters:
        - name: q
          in: query
          description: Part of a display name or address.
          schema: {type: string, maxLength: 64}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Peers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/LxmfPeer"}
                  next_cursor: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /reticulum/announce:
    post:
      tags: [reticulum]
      operationId: announceLxmf
      summary: Announce your LXMF address now (or the station's).
      description: |
        The announce goes out on the Wi-Fi at once and over each backhaul link the next
        time it is up; it never starts a call. Announcing for the station needs `operator`.
      x-hermes-role: user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                as_station: {type: boolean, default: false}
      responses:
        "202": {description: Announced.}
        "409":
          description: Reticulum is off (`code` = `reticulum_off`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "429":
          description: Announced too recently (`code` = `rate_limited`).
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  /schedules:
    get:
      tags: [schedules]
      operationId: listSchedules
      summary: Connection schedules.
      x-hermes-role: readonly
      responses:
        "200":
          description: Connection schedules.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Schedule"}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [schedules]
      operationId: createSchedule
      summary: Create a connection schedule.
      x-hermes-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScheduleWrite"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Schedule"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Invalid"}
  /schedules/next:
    get:
      tags: [schedules]
      operationId: nextSchedule
      summary: The next window the station will call in, if any.
      x-hermes-role: readonly
      responses:
        "200":
          description: The next window.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleNext"}
        "204": {description: No enabled schedule.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /schedules/{schedule_id}:
    parameters:
      - name: schedule_id
        in: path
        required: true
        schema: {type: integer, format: int64}
    get:
      tags: [schedules]
      operationId: getSchedule
      summary: A schedule.
      x-hermes-role: readonly
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Schedule"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [schedules]
      operationId: updateSchedule
      summary: Change a schedule.
      x-hermes-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScheduleWrite"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Schedule"}
        "422": {$ref: "#/components/responses/Invalid"}
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      summary: Delete a schedule.
      x-hermes-role: admin
      responses:
        "204": {description: Deleted.}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /queue:
    get:
      tags: [queue]
      operationId: listQueue
      summary: Jobs waiting in the UUCP spool.
      x-hermes-role: operator
      parameters:
        - name: station
          in: query
          schema: {$ref: "#/components/schemas/UucpName"}
      responses:
        "200":
          description: Jobs, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/QueueJob"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /queue/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        description: The UUCP job id (`<station>.<id>`).
        schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,64}$"}
    delete:
      tags: [queue]
      operationId: cancelJob
      summary: Cancel a job. A mail job's sender is told it was not delivered.
      x-hermes-role: operator
      responses:
        "204": {description: Cancelled.}
        "404": {$ref: "#/components/responses/NotFound"}
  /queue/call:
    post:
      tags: [queue]
      operationId: callNow
      summary: Call a station now (or every station with work queued).
      x-hermes-role: operator
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                station: {$ref: "#/components/schemas/UucpName"}
                transport:
                  $ref: "#/components/schemas/Transport"
                  description: Default `uucp`. `reticulum` brings up the station's backhaul link.
      responses:
        "202": {description: Call started; follow it on the `queue` and `modem.status` topics.}
        "409":
          description: A call is already in progress (`code` = `busy`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /queue/stop:
    post:
      tags: [queue]
      operationId: stopCalls
      summary: Stop the call in progress.
      x-hermes-role: operator
      responses:
        "204": {description: Stopped.}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /radio:
    get:
      tags: [radio]
      operationId: getRadioState
      summary: The radio's current state (the same data as the `radio.state` topic).
      x-hermes-role: readonly
      responses:
        "200":
          description: State.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RadioState"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /radio/active-profile:
    put:
      tags: [radio]
      operationId: selectProfile
      summary: Switch to another saved profile.
      x-hermes-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: {type: integer, minimum: 0}
      responses:
        "200":
          description: Switched.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RadioState"}
        "409":
          description: Refused while transmitting (`code` = `busy`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
  /radio/profiles:
    get:
      tags: [radio]
      operationId: listProfiles
      summary: Every saved radio profile.
      x-hermes-role: readonly
      responses:
        "200":
          description: Every saved profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/RadioProfile"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /radio/profiles/{profile}:
    parameters:
      - name: profile
        in: path
        required: true
        schema: {type: integer, minimum: 0}
    get:
      tags: [radio]
      operationId: getProfile
      summary: A saved radio profile.
      x-hermes-role: readonly
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RadioProfile"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [radio]
      operationId: updateProfile
      summary: Change a profile. On the active profile the radio follows at once.
      description: All fields are validated before any is applied.
      x-hermes-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RadioProfilePatch"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RadioProfile"}
        "422": {$ref: "#/components/responses/Invalid"}
  /radio/protection/reset:
    post:
      tags: [radio]
      operationId: resetProtection
      summary: Clear the high-SWR protection after the antenna is fixed.
      x-hermes-role: operator
      responses:
        "204": {description: Cleared.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /radio/settings:
    get:
      tags: [radio]
      operationId: getRadioSettings
      summary: Station-wide radio settings (default profile and fallback, tuning step, SWR limit, BFO).
      x-hermes-role: readonly
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RadioSettings"}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [radio]
      operationId: updateRadioSettings
      summary: Change station-wide radio settings.
      x-hermes-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RadioSettingsPatch"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RadioSettings"}
        '422': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /radio/defaults:
    post:
      tags: [radio]
      operationId: restoreRadioDefaults
      summary: Restore the radio's factory profiles.
      x-hermes-role: admin
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/RadioProfile"}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /digi/log:
    get:
      tags: [digi]
      operationId: getDigiLog
      summary: Digital-mode traffic, newest first.
      description: |
        Everything the radio decoded or sent in FT8, CW, RTTY, and every D-STAR header it
        heard. The live feed is the `digi` WebSocket topic. Text and callsigns came over the
        air: untrusted, render as plain text.
      x-hermes-role: readonly
      parameters:
        - name: mode
          in: query
          schema: {$ref: "#/components/schemas/DigiMode"}
        - name: dir
          in: query
          schema: {type: string, enum: [rx, tx]}
        - name: callsign
          in: query
          description: Entries from or to this callsign.
          schema: {type: string, maxLength: 16}
        - name: since
          in: query
          schema: {type: string, format: date-time}
        - name: until
          in: query
          schema: {type: string, format: date-time}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Entries.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/DigiEntry"}
                  next_cursor: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /radio/digi:
    get:
      tags: [digi]
      operationId: getDigiSettings
      summary: CW, RTTY and D-STAR settings.
      x-hermes-role: readonly
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DigiSettings"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      tags: [digi]
      operationId: updateDigiSettings
      summary: Change CW, RTTY or D-STAR settings.
      description: Turning on `dstar.encrypt` also needs `settings.encryption.dstar_voice`.
      x-hermes-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DigiSettings"}
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DigiSettings"}
        "403":
          description: D-STAR encryption is not allowed on this station (`code` = `encryption_not_allowed`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422": {$ref: "#/components/responses/Invalid"}

  /modem:
    get:
      tags: [modem]
      operationId: getModemStatus
      summary: Mercury's link state (the same data as the `modem.status` topic).
      x-hermes-role: readonly
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModemStatus"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /modem/config:
    get:
      tags: [modem]
      operationId: getModemConfig
      summary: The modem configuration.
      x-hermes-role: operator
      responses:
        "200":
          description: Configuration.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModemConfig"}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [modem]
      operationId: updateModemConfig
      summary: Change the modem configuration. Applied before the reply; a change that fails is not saved.
      x-hermes-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModemConfigPatch"}
      responses:
        "200":
          description: Applied and saved.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModemConfig"}
        "409":
          description: |
            `listen_mode` changed while an ARQ link is up or a broadcast is on the air
            (`code` = `busy`); `modem.status` says which (`link`, `broadcast.state`).
            Nothing was applied.
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        "422":
          description: Not applied (a validation error).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  /system:
    get:
      tags: [system]
      operationId: getSystem
      summary: Station identity, versions, clock, resources and network.
      x-hermes-role: readonly
      responses:
        "200":
          description: System status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/System"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /system/settings:
    get:
      tags: [system]
      operationId: getSettings
      summary: Station settings.
      x-hermes-role: readonly
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [system]
      operationId: updateSettings
      summary: Change station settings.
      x-hermes-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Settings"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Settings"}
        "422": {$ref: "#/components/responses/Invalid"}
  /system/reboot:
    post:
      tags: [system]
      operationId: reboot
      summary: Reboot the station.
      x-hermes-role: admin
      responses:
        "202": {description: Rebooting.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /system/shutdown:
    post:
      tags: [system]
      operationId: shutdown
      summary: Shut the station down.
      x-hermes-role: admin
      responses:
        "202": {description: Shutting down.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /system/factory-reset:
    post:
      tags: [system]
      operationId: factoryReset
      summary: Erase the station's data, in two calls.
      description: |
        The first call (no body) returns a confirmation code valid for 60 seconds. The
        second call, with that code, erases messages, attachments, users other than `root`
        and settings, then reboots. It never deletes system directories.
      x-hermes-role: admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmation_code: {type: string}
      responses:
        "200":
          description: First call — the code to confirm with.
          content:
            application/json:
              schema:
                type: object
                required: [confirmation_code, expires_at]
                properties:
                  confirmation_code: {type: string}
                  expires_at: {type: string, format: date-time}
        "202": {description: "Second call — erasing, then rebooting."}
        "422":
          description: Wrong or expired code (`code` = `bad_confirmation`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  /logs/{log}:
    parameters:
      - name: log
        in: path
        required: true
        schema: {type: string, enum: [mail, uucp, uucp-debug, backend]}
    get:
      tags: [logs]
      operationId: readLog
      summary: The last lines of a log.
      x-hermes-role: operator
      parameters:
        - name: lines
          in: query
          schema: {type: integer, minimum: 1, maximum: 5000, default: 500}
      responses:
        "200":
          description: Lines, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/LogLine"}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /wifi:
    get:
      tags: [wifi]
      operationId: getWifi
      summary: The Wi-Fi access point.
      x-hermes-role: admin
      responses:
        "200":
          description: The access point.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Wifi"}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [wifi]
      operationId: updateWifi
      summary: Change the access point; it restarts, so clients reconnect.
      x-hermes-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WifiPatch"}
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Wifi"}
        "422": {$ref: "#/components/responses/Invalid"}
  /wifi/allowed-macs:
    get:
      tags: [wifi]
      operationId: listAllowedMacs
      summary: Wi-Fi addresses allowed when MAC filtering is on.
      x-hermes-role: admin
      responses:
        "200":
          description: Allowed addresses (used when `mac_filter` is on).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/MacAddress"}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [wifi]
      operationId: allowMac
      summary: Allow a Wi-Fi address.
      x-hermes-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mac]
              properties:
                mac: {$ref: "#/components/schemas/MacAddress"}
      responses:
        "201": {description: Added.}
        "409": {$ref: "#/components/responses/Conflict"}
  /wifi/allowed-macs/{mac}:
    parameters:
      - name: mac
        in: path
        required: true
        schema: {$ref: "#/components/schemas/MacAddress"}
    delete:
      tags: [wifi]
      operationId: removeMac
      summary: Remove an allowed Wi-Fi address.
      x-hermes-role: admin
      responses:
        "204": {description: Removed.}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /gps:
    get:
      tags: [gps]
      operationId: getGps
      summary: Position, fix and logging settings.
      x-hermes-role: readonly
      responses:
        "200":
          description: GPS state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Gps"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /gps/stations:
    get:
      tags: [gps]
      operationId: listStationPositions
      summary: Every known station with its last-known position, for the map.
      description: |
        Stations this one can reach (from `/etc/uucp/sys`), each with the position it last
        reported over the air or was given manually. Stations with no known position are
        still listed, with null position fields. A reported position is a claim, not an
        identity.
      x-hermes-role: readonly
      responses:
        "200":
          description: Stations with their last-known positions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Station"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /gps/trip:
    get:
      tags: [gps]
      operationId: getCurrentTrip
      summary: The current trip and its recorded positions (the breadcrumb).
      description: |
        The station's open trip: every position fix is stored in the database and listed
        here, oldest first, so the map can draw the breadcrumb. A trip opens automatically
        and closes only via `POST /gps/trip/close`, so one is always open; `ended_at` is
        null until then.
      x-hermes-role: readonly
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The current trip and its points.
          content:
            application/json:
              schema:
                type: object
                required: [trip, data]
                properties:
                  trip: {$ref: "#/components/schemas/Trip"}
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/GpsPoint"}
                  next_cursor: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /gps/trip/close:
    post:
      tags: [gps]
      operationId: closeTrip
      summary: Close the current trip and start a new one.
      description: |
        Sets `ended_at` on the open trip and starts a new one; the next position fix is
        recorded in the new trip. Nothing is deleted, so closed trips stay in the history.
        Returns the trip that was closed.
      x-hermes-role: operator
      responses:
        "200":
          description: The trip that was closed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Trip"}
        "409":
          description: No trip is open (`code` = `no_open_trip`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /gps/trips:
    get:
      tags: [gps]
      operationId: listTrips
      summary: All recorded trips, newest first.
      x-hermes-role: readonly
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Trips.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Trip"}
                  next_cursor: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /gps/trips/{trip_id}:
    parameters:
      - name: trip_id
        in: path
        required: true
        schema: {type: integer, format: int64}
    get:
      tags: [gps]
      operationId: getTrip
      summary: A recorded trip and its positions.
      x-hermes-role: readonly
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The trip and its points.
          content:
            application/json:
              schema:
                type: object
                required: [trip, data]
                properties:
                  trip: {$ref: "#/components/schemas/Trip"}
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/GpsPoint"}
                  next_cursor: {type: string}
        "404": {$ref: "#/components/responses/NotFound"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /gps/settings:
    patch:
      tags: [gps]
      operationId: updateGpsSettings
      summary: Change GPS logging.
      x-hermes-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GpsSettings"}
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GpsSettings"}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /gps/files:
    get:
      tags: [gps]
      operationId: listGpsFiles
      summary: Recorded position files.
      x-hermes-role: readonly
      responses:
        "200":
          description: Recorded position files.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/GpsFile"}
        '401': {$ref: '#/components/responses/Unauthorized'}
    delete:
      tags: [gps]
      operationId: deleteGpsFiles
      summary: Delete every recorded file and cancel their queued transfers.
      x-hermes-role: operator
      responses:
        "204": {description: Deleted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /gps/files/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,128}$"}
    get:
      tags: [gps]
      operationId: downloadGpsFile
      summary: Download a position file.
      x-hermes-role: readonly
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        "404": {$ref: "#/components/responses/NotFound"}
  /gps/sos:
    post:
      tags: [gps]
      operationId: sendSos
      summary: Send the current position as an emergency message to `settings.sos_recipients`.
      x-hermes-role: user
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "409":
          description: No GPS fix (`code` = `no_fix`).
          content:
            application/problem+json:
              schema: {$ref: "#/components/schemas/Problem"}

  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Audit log — who did what, when. Kept 90 days.
      description: |
        Logins, user and setting changes, system actions, and every transmission
        (`radio.tx`: user, mode, frequency, text or "voice", start and end). Filter with
        `action`.
      x-hermes-role: admin
      parameters:
        - name: user_id
          in: query
          schema: {type: integer, format: int64}
        - name: action
          in: query
          schema: {type: string}
        - name: since
          in: query
          schema: {type: string, format: date-time}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Events, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Event"}
                  next_cursor: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /apps:
    get:
      tags: [apps]
      operationId: listApps
      summary: The frontend apps installed on this station.
      description: |
        Each app (chat, GPS, radio, mail…) is an independent web app served under its own
        path and built only on this API. The station's shell reads this list to show the apps
        a user may open. Apps are installed and updated as Debian packages, not through the API.
      x-hermes-role: readonly
      responses:
        "200":
          description: Apps.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/App"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /apps/{app_id}:
    parameters:
      - name: app_id
        in: path
        required: true
        schema: {type: string, pattern: "^[a-z0-9-]{1,32}$"}
    patch:
      tags: [apps]
      operationId: updateApp
      summary: Enable or disable an app, or change who may open it.
      x-hermes-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                min_role: {$ref: "#/components/schemas/Role"}
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/App"}
        "404": {$ref: "#/components/responses/NotFound"}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hermes_session
      description: Set by `POST /session`. Also accepted on the WebSocket upgrade.
    bearerToken:
      type: http
      scheme: bearer
      description: The same opaque session token, for tools that don't keep cookies.

  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema: {type: string}
    UserId:
      name: user_id
      in: path
      required: true
      schema: {type: integer, format: int64}
    MessageId:
      name: message_id
      in: path
      required: true
      schema: {type: integer, format: int64}

  responses:
    Unauthorized:
      description: Not logged in, or the session ended (`code` = `unauthenticated`).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: The role is too low (`code` = `forbidden`).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: No such resource (`code` = `not_found`).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: Conflicts with the current state (`code` says which).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Invalid:
      description: Validation failed (`code` = `invalid`; `errors` per field).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    TooLarge:
      description: Over the size limit for HF (`code` = `too_large`).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    TooManyRequests:
      description: Too many failed logins (`code` = `rate_limited`).
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri-reference, example: "https://hermes.radio/problems/invalid"}
        title: {type: string, example: Validation failed}
        status: {type: integer, example: 422}
        code:
          type: string
          description: Stable machine-readable code.
          example: invalid
        detail: {type: string}
        request_id:
          type: string
          description: The `X-Request-Id` of the failed request.
        errors:
          type: object
          description: Messages per field, for forms.
          additionalProperties:
            type: array
            items: {type: string}

    Timestamp:
      type: string
      format: date-time
      description: ISO 8601, UTC.
    UucpName:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,32}$"
      description: A station's UUCP system name.
    AreaName:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,32}$"
      description: A broadcast area's name, as in the NNCP configuration.
    LxmfAddress:
      type: string
      pattern: "^[0-9a-f]{32}$"
      description: An LXMF address (the 16-byte hash of an `lxmf.delivery` destination), in hex.
    Transport:
      type: string
      enum: [uucp, nncp, reticulum]
      description: What an ARQ call carries. `nncp` only on stations that run NNCP.
    Role:
      type: string
      enum: [readonly, user, operator, admin]
    Mode:
      type: string
      enum: [LSB, USB, CW, FM, AM, DRM, FT8, RTTY, DSTAR]
    Codec:
      type: string
      enum: [auto, vvc, lpcnet, none]
      default: auto
    MacAddress:
      type: string
      pattern: "^([0-9a-f]{2}:){5}[0-9a-f]{2}$"

    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, degraded]}
        components:
          type: object
          properties:
            radio: {type: string, enum: [ok, down, absent]}
            modem: {type: string, enum: [ok, down]}
            database: {type: string, enum: [ok, down]}
            uucp: {type: string, enum: [ok, down]}
            reticulum: {type: string, enum: [ok, down, absent]}

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, writeOnly: true}
    Session:
      type: object
      required: [user, expires_at]
      properties:
        user: {$ref: "#/components/schemas/User"}
        token:
          type: string
          description: Returned only by `POST /session`.
        expires_at: {$ref: "#/components/schemas/Timestamp"}

    User:
      type: object
      required: [id, username, role, disabled, created_at]
      properties:
        id: {type: integer, format: int64}
        username:
          type: string
          pattern: "^[a-z0-9._-]{1,32}$"
          description: Login id and mailbox local-part. The email address is `<username>@<domain>`.
        display_name:
          type: [string, "null"]
          maxLength: 64
          description: Human name, optional; when null the UI shows the username.
        avatar:
          type: [string, "null"]
          readOnly: true
          description: URL of the user's avatar; set with `PUT /users/{id}/avatar`, cleared with `DELETE /users/{id}/avatar`. Null when none.
        role: {$ref: "#/components/schemas/Role"}
        locale: {$ref: "#/components/schemas/Locale"}
        phone: {type: [string, "null"]}
        location: {type: [string, "null"]}
        disabled: {type: boolean}
        lxmf_address:
          readOnly: true
          oneOf: [$ref: "#/components/schemas/LxmfAddress", type: "null"]
          description: |
            The user's LXMF address. The station holds its identity and creates it the first
            time Reticulum is on; null until then. The user can export it to Sideband
            (`POST /users/{id}/lxmf-identity/export`) and use the same address there.
        last_login_at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        updated_at: {$ref: "#/components/schemas/Timestamp"}
    UserPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/User"}
        next_cursor: {type: string}
    UserCreate:
      type: object
      required: [username, password]
      properties:
        username: {type: string, pattern: "^[a-z0-9._-]{1,32}$"}
        password: {type: string, minLength: 8, writeOnly: true}
        display_name:
          type: [string, "null"]
          maxLength: 64
          description: Human name, optional; when null the UI shows the username.
        role: {$ref: "#/components/schemas/Role"}
        locale: {$ref: "#/components/schemas/Locale"}
        phone: {type: string}
        location: {type: string}
    UserPatch:
      type: object
      description: Only admins may change `role` or `disabled`.
      properties:
        display_name: {type: string, maxLength: 64}
        role: {$ref: "#/components/schemas/Role"}
        locale: {$ref: "#/components/schemas/Locale"}
        phone: {type: [string, "null"]}
        location: {type: [string, "null"]}
        disabled: {type: boolean}
    Device:
      type: object
      required: [id, device_type, platform, created_at]
      properties:
        id: {type: integer, format: int64}
        device_type: {type: string, enum: [mobile, desktop, browser]}
        device_name: {type: [string, "null"]}
        platform: {type: string, enum: [ios, android, web, linux]}
        last_seen_at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        updated_at: {$ref: "#/components/schemas/Timestamp"}
    DeviceCreate:
      type: object
      required: [device_type, platform, push_token]
      properties:
        device_type: {type: string, enum: [mobile, desktop, browser]}
        device_name: {type: [string, "null"]}
        platform: {type: string, enum: [ios, android, web, linux]}
        push_token:
          type: string
          writeOnly: true
          description: FCM/APNs token; stored hashed and never returned.
    PasswordChange:
      type: object
      required: [new_password]
      properties:
        current_password:
          type: string
          writeOnly: true
          description: Required when changing your own password.
        new_password: {type: string, minLength: 8, writeOnly: true}
    Passphrase:
      type: object
      required: [passphrase]
      properties:
        passphrase: {type: string, writeOnly: true}

    MessageStatus:
      type: string
      enum: [draft, queued, broadcasting, sent, delivered, failed, received]
      description: |
        For outgoing messages, derived from the recipients' states, or for a broadcast from
        `broadcast.state` (`waiting` and `waiting_arq` are `queued`; `transmitting` and
        `preempted` are `broadcasting`; `done` and `stopped` are `sent`).
        `delivered` only for LXMF, once every recipient has confirmed.
    MessageChannel:
      type: string
      enum: [uucp, broadcast, lxmf]
      description: "`uucp`: to each recipient over UUCP. `broadcast`: to an area, over Mercury's broadcast plane. `lxmf`: to LXMF addresses, over Reticulum."
    Message:
      type: object
      required: [id, direction, channel, status, origin, subject, body_encrypted, recipients, attachments, created_at]
      properties:
        id: {type: integer, format: int64}
        direction: {type: string, enum: [in, out]}
        channel: {$ref: "#/components/schemas/MessageChannel"}
        status: {$ref: "#/components/schemas/MessageStatus"}
        client_message_id:
          type: [string, "null"]
          description: The idempotency key the client sent when creating the draft, if any.
        content_type:
          type: string
          enum: [text, markdown, audio, system, attachment_only]
          default: text
        origin:
          oneOf: [$ref: "#/components/schemas/UucpName", type: "null"]
          description: |
            For incoming messages, the UUCP system that delivered the file, never the
            sender field inside it; for a broadcast, the station whose signature it
            carries. Null for LXMF (see `lxmf.from`), and for a broadcast from an unknown
            station to an area with `allow_unknown`.
        claimed_origin:
          type: [string, "null"]
          maxLength: 64
          description: |
            Only when `origin` is null: the sender the broadcast names, unverified.
            Untrusted; render as plain text.
        author_id:
          type: [integer, "null"]
          format: int64
          description: The local user who wrote it; null for incoming messages.
        author:
          type: [string, "null"]
          maxLength: 32
          description: |
            For an incoming broadcast that names its author (`with_author`), the username
            (mailbox name) at `origin`, vouched for by that station's signature, so a reply
            can go to `<author>@<origin's domain>`. Null when the broadcast came from the
            station itself, for UUCP messages, and when `origin` is null. Render as plain
            text.
        subject:
          type: string
          maxLength: 255
          description: Untrusted on incoming messages; render as plain text.
        body:
          type: string
          description: |
            Absent in lists, and when `body_encrypted` (use `/decrypt`). Untrusted on
            incoming messages; render as plain text.
        body_encrypted: {type: boolean}
        reply_to_message_id:
          type: [integer, "null"]
          format: int64
          description: The message this one replies to.
        forwarded_from_id:
          type: [integer, "null"]
          format: int64
          description: The message this one forwards.
        recipients:
          type: array
          description: UUCP only. Empty for a broadcast, which nobody acknowledges, and for LXMF (see `lxmf.recipients`).
          items: {$ref: "#/components/schemas/Recipient"}
        broadcast: {$ref: "#/components/schemas/Broadcast"}
        lxmf: {$ref: "#/components/schemas/Lxmf"}
        attachments:
          type: array
          items: {$ref: "#/components/schemas/Attachment"}
        reactions:
          type: array
          description: Emoji reactions; one per user, at most 20 per message.
          items: {$ref: "#/components/schemas/Reaction"}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        updated_at: {$ref: "#/components/schemas/Timestamp"}
        received_at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]}
        read_at:
          oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]
          description: For incoming messages, when the current user marked it read.
    Recipient:
      type: object
      required: [station, status]
      properties:
        station: {$ref: "#/components/schemas/UucpName"}
        status: {type: string, enum: [pending, queued, sent, failed, cancelled]}
        uucp_job_id: {type: [string, "null"]}
        queued_at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]}
        sent_at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]}
        error: {type: [string, "null"]}
    Reaction:
      type: object
      required: [user_id, emoji, created_at]
      properties:
        user_id: {type: integer, format: int64}
        emoji: {type: string, maxLength: 16}
        created_at: {$ref: "#/components/schemas/Timestamp"}
    MessagePage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Message"}
        next_cursor: {type: string}
    MessageCreate:
      type: object
      required: [subject]
      description: Exactly one of `recipients`, `broadcast` or `lxmf`. For LXMF, `subject` is the title and may be empty.
      oneOf:
        - required: [recipients]
          not: {anyOf: [{required: [broadcast]}, {required: [lxmf]}]}
        - required: [broadcast]
          not: {anyOf: [{required: [recipients]}, {required: [lxmf]}]}
        - required: [lxmf]
          not: {anyOf: [{required: [recipients]}, {required: [broadcast]}]}
      properties:
        subject: {type: string, maxLength: 255}
        body: {type: string}
        content_type:
          type: string
          enum: [text, markdown, audio, system, attachment_only]
          default: text
        client_message_id:
          type: string
          maxLength: 64
          description: Client-chosen idempotency key; retries of the same create return the same draft.
        reply_to_message_id:
          type: [integer, "null"]
          format: int64
          description: A message this one replies to.
        forwarded_from_id:
          type: [integer, "null"]
          format: int64
          description: A message this one forwards.
        recipients:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/UucpName"}
        broadcast: {$ref: "#/components/schemas/BroadcastCreate"}
        lxmf: {$ref: "#/components/schemas/LxmfCreate"}
        attachment_ids:
          type: array
          maxItems: 1
          description: One attachment per message, as `.hmp` carries today.
          items: {type: integer, format: int64}
        passphrase:
          type: string
          writeOnly: true
          description: |
            When given, the body is encrypted with it (AES-256, as today). Refused unless
            `settings.encryption.messages` is on. Not for LXMF, which is already encrypted
            end to end.
    MessagePatch:
      type: object
      description: A draft keeps its channel; `recipients`, `broadcast` and `lxmf` can't swap.
      properties:
        subject: {type: string, maxLength: 255}
        body: {type: string}
        content_type:
          type: string
          enum: [text, markdown, audio, system, attachment_only]
        reply_to_message_id:
          type: [integer, "null"]
          format: int64
          description: A message this one replies to.
        forwarded_from_id:
          type: [integer, "null"]
          format: int64
          description: A message this one forwards.
        recipients:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/UucpName"}
        broadcast: {$ref: "#/components/schemas/BroadcastCreate"}
        lxmf: {$ref: "#/components/schemas/LxmfCreate"}
        attachment_ids:
          type: array
          maxItems: 1
          items: {type: integer, format: int64}
        passphrase: {type: string, writeOnly: true}

    BroadcastMode:
      type: string
      enum: [DATAC1, DATAC3, DATAC4, DATAC15, DATAC17, QAM16C2, MFSK, MFSK500]
      description: |
        A Mercury payload mode the station can listen in (`mercury -m`, the `MODE`
        command): the modes Mercury can switch to at runtime. Sender and receivers must use
        the same one. Measured by Mercury (`docs/MODES.md`, `docs/BROADCAST-FILE.md`):

        | mode | index | frame | bit/s | bandwidth |
        | --- | --- | --- | --- | --- |
        | DATAC1 | 0 | 510 B | 976 | 1687 Hz |
        | DATAC3 | 1 | 126 B | 316 | 562 Hz |
        | DATAC4 | 3 | 54 B | 84 | 250 Hz |
        | DATAC15 | 7 | 30 B | 64 | 187 Hz |
        | DATAC17 | 9 | 1180 B | 1407 | 2062 Hz |
        | QAM16C2 | 10 | 1213 B | 3130 | 2062 Hz |
        | MFSK | 11 | 98 B | 61 | 1000 Hz |
        | MFSK500 | 12 | 98 B | 31 | 500 Hz |

        Broadcast chat (`modem.chat`, plane `broadcast`) works in any of them; a broadcast
        message needs a `BroadcastFileMode`. DATAC0, DATAC13, DATAC14, DATAC16 and FSK_LDPC
        can't be selected at runtime. A weak but steady path needs a more robust mode, while
        a fading one needs more `cycles`.
    BroadcastFileMode:
      type: string
      enum: [DATAC1, DATAC3, DATAC4, DATAC17, QAM16C2]
      description: |
        The listen modes that can carry a broadcast message: the carousel's symbols are
        41 bytes, so a frame needs at least that much room.
    BroadcastCreate:
      type: object
      required: [area]
      description: |
        The whole broadcast (the `.hmp` file with its attachment, plus the header) is at
        most 1.44 MB; larger is refused at send (413).
      properties:
        area: {$ref: "#/components/schemas/AreaName"}
        mode:
          $ref: "#/components/schemas/BroadcastFileMode"
          description: |
            Default `modem.config.listen_mode`. Required (422) when the listen mode can't
            carry a broadcast message (DATAC15, MFSK, MFSK500).
        cycles:
          type: integer
          minimum: 1
          maximum: 16
          default: 2
          description: |
            Passes of the carousel. A receiver that falls short decodes nothing at all, and
            extra passes cost airtime but not delivery time, so err high on a fading path.
        with_author:
          type: boolean
          default: false
          description: |
            Put the sender's username on the air, so receivers can show it and reply to
            the user. Without it the broadcast comes from the station; the audit log
            records the user either way.
        encrypt:
          type: boolean
          default: false
          description: |
            Encrypt to the area as an NNCP area packet. Needs the area's keys
            (`has_keys`) and `settings.encryption.messages`; otherwise the message goes out
            in the clear, signed.
        expires_at:
          oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]
          description: Receivers drop the broadcast after this, decoded or not.
        supersedes:
          type: [integer, "null"]
          format: int64
          description: An earlier broadcast of this station to the same area that this one replaces.
    Broadcast:
      type: object
      required: [area, mode, encrypted]
      properties:
        area: {$ref: "#/components/schemas/AreaName"}
        mode: {$ref: "#/components/schemas/BroadcastFileMode"}
        encrypted: {type: boolean}
        cycles: {type: [integer, "null"], description: Outgoing only.}
        expires_at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]}
        supersedes:
          type: [integer, "null"]
          format: int64
          description: The message this one replaces, when this station has it.
        state:
          type: string
          enum: [waiting, waiting_arq, transmitting, preempted, done, stopped, failed]
          description: |
            Outgoing only. `waiting`: behind another broadcast. `waiting_arq`: an ARQ
            session holds the modem. `preempted`: an ARQ session started while it was on
            the air and stopped it; it goes on the air again once the link is idle.
            `stopped`: a user stopped it (`POST /messages/{id}/stop`).
        cycle: {type: [integer, "null"], minimum: 1, description: "Outgoing only; the pass of the carousel on the air, from 1."}
        frames_sent: {type: integer, description: Outgoing only.}
        frames_total: {type: integer, description: Outgoing only; every pass of the carousel.}
        air_time_s:
          type: integer
          description: Outgoing only; estimated from the mode's bit rate and `frames_total`.
        started_at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]}
        ended_at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]}
        withdrawn_at:
          oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]
          description: Incoming only; when the sender withdrew it.
        error: {type: [string, "null"]}
    LxmfCreate:
      type: object
      required: [to]
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: "#/components/schemas/LxmfAddress"}
        method:
          type: string
          enum: [auto, direct, opportunistic, propagated]
          default: auto
          description: |
            LXMF's delivery method. `auto`: direct when a path to the recipient is known,
            otherwise through the propagation node. `opportunistic` fits only short
            messages in one packet.
        as_station:
          type: boolean
          default: false
          description: Send from the station's LXMF address instead of the user's (`operator`).
    Lxmf:
      type: object
      required: [method]
      properties:
        method: {type: string, enum: [direct, opportunistic, propagated]}
        from:
          type: object
          description: Incoming only.
          required: [address, verified]
          properties:
            address: {$ref: "#/components/schemas/LxmfAddress"}
            display_name:
              type: [string, "null"]
              maxLength: 64
              description: From the sender's announce; a claim. Render as plain text.
            verified:
              type: boolean
              description: |
                The signature checked against the sender's identity. False while the
                station hasn't heard that identity announce; a wrong signature is dropped.
        to:
          $ref: "#/components/schemas/LxmfAddress"
          description: Incoming only; the local address it was sent to (a user's or the station's).
        to_user:
          type: [string, "null"]
          description: Incoming only; the username whose address that is, or null for the station's.
        recipients:
          type: array
          description: Outgoing only.
          items: {$ref: "#/components/schemas/LxmfRecipient"}
    LxmfRecipient:
      type: object
      required: [address, state]
      properties:
        address: {$ref: "#/components/schemas/LxmfAddress"}
        display_name: {type: [string, "null"], maxLength: 64}
        state:
          type: string
          enum: [outbound, sending, sent, delivered, rejected, cancelled, failed]
          description: LXMF's own states; `delivered` is the recipient's proof of delivery.
        delivered_at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]}
        error: {type: [string, "null"]}
    LxmfPeer:
      type: object
      required: [address, last_heard_at]
      properties:
        address: {$ref: "#/components/schemas/LxmfAddress"}
        display_name:
          type: [string, "null"]
          maxLength: 64
          description: From the announce; a claim. Render as plain text.
        propagation_node: {type: boolean, description: It announced as an LXMF propagation node.}
        hops: {type: [integer, "null"]}
        via:
          oneOf: [$ref: "#/components/schemas/UucpName", type: "null"]
          description: The backhaul link it was heard over; null for the local network.
        last_heard_at: {$ref: "#/components/schemas/Timestamp"}
    ReticulumStatus:
      type: object
      required: [enabled, running]
      properties:
        enabled: {type: boolean}
        running: {type: boolean}
        transport_identity:
          type: [string, "null"]
          pattern: "^[0-9a-f]{32}$"
          description: The station's Reticulum transport identity hash.
        station_address:
          oneOf: [$ref: "#/components/schemas/LxmfAddress", type: "null"]
          description: The station's own LXMF address.
        propagation:
          type: object
          properties:
            enabled: {type: boolean}
            address: {oneOf: [$ref: "#/components/schemas/LxmfAddress", type: "null"]}
            messages_stored: {type: integer}
            bytes_stored: {type: integer}
        local_clients:
          type: integer
          description: Reticulum programs on the Wi-Fi connected to the station's interface.
        links_up: {type: integer}
    ReticulumSettings:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
          description: Needs `settings.encryption.reticulum`.
        propagation:
          type: object
          properties:
            enabled:
              type: boolean
              default: true
              description: Run an LXMF propagation node, so messages wait here for intermittent links and offline phones.
            storage_limit_mb: {type: integer, minimum: 1, default: 200}
            outbound_node:
              oneOf: [$ref: "#/components/schemas/LxmfAddress", type: "null"]
              description: Where this station's propagated messages go; null for its own node.
        local:
          type: object
          description: How phones and computers on the station's Wi-Fi reach its node.
          properties:
            tcp_port: {type: [integer, "null"], minimum: 1, maximum: 65535, default: 4242}
            auto_interface: {type: boolean, default: true, description: Reticulum's link-local discovery on the Wi-Fi.}
        announce_interval_s:
          type: integer
          minimum: 300
          default: 1800
          description: How often the station and its users' addresses are announced. Over backhaul, Reticulum's own announce cap applies.
        arq_callsign:
          type: string
          maxLength: 15
          description: |
            The secondary callsign (Mercury `MYCALL`) that routes an incoming ARQ call to
            Reticulum instead of UUCP; calls to the station's primary callsign stay UUCP.
            Default `<callsign>-R`.
    ReticulumLink:
      type: object
      required: [station, enabled, bring_up, state]
      properties:
        station: {$ref: "#/components/schemas/UucpName"}
        enabled: {type: boolean}
        bring_up: {$ref: "#/components/schemas/LinkBringUp"}
        idle_timeout_s: {type: integer, minimum: 30}
        peer_arq_callsign: {type: string, maxLength: 15, description: The other station's Reticulum callsign.}
        state: {type: string, enum: [idle, calling, connected, disconnecting, failed]}
        remote_identity:
          type: [string, "null"]
          pattern: "^[0-9a-f]{32}$"
          description: The other station's transport identity, learned on the first session.
        last_contact_at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]}
        bytes_tx: {type: integer}
        bytes_rx: {type: integer}
        error: {type: [string, "null"]}
    ReticulumLinkWrite:
      type: object
      required: [bring_up, peer_arq_callsign]
      properties:
        enabled: {type: boolean, default: true}
        bring_up: {$ref: "#/components/schemas/LinkBringUp"}
        idle_timeout_s: {type: integer, minimum: 30, default: 120}
        peer_arq_callsign: {type: string, maxLength: 15}
    LinkBringUp:
      type: string
      enum: [on_demand, scheduled, permanent]
      description: |
        `on_demand`: call when messages wait for that station (never for announces alone).
        `scheduled`: only in schedules with `transport` = `reticulum`. `permanent`: keep the
        session up; it holds the modem, so UUCP calls and broadcasts wait.
    Area:
      type: object
      required: [name, has_keys, members, allow_unknown]
      properties:
        name: {$ref: "#/components/schemas/AreaName"}
        has_keys:
          type: boolean
          description: |
            This station holds the area's keys, so it can send and read encrypted
            broadcasts to it. Plain broadcasts don't need them.
        members:
          type: array
          description: The stations subscribed to the area.
          items: {$ref: "#/components/schemas/UucpName"}
        allow_unknown:
          type: boolean
          description: Keep broadcasts signed by a station this one doesn't know (NNCP's `allow-unknown`).
    Attachment:
      type: object
      required: [id, original_name, mime_type, size_bytes, encrypted, codec, status, created_at]
      properties:
        id: {type: integer, format: int64}
        message_id: {type: [integer, "null"], format: int64}
        original_name: {type: string}
        mime_type: {type: string}
        size_bytes:
          type: integer
          description: Size as sent over the air, after encoding.
        encrypted: {type: boolean}
        codec: {type: string, enum: [vvc, lpcnet, none]}
        status:
          type: string
          enum: [pending, processing, ready, failed, expired]
          description: |
            `pending` and `processing` while the upload is recompressed (VVC) or encoded
            (LPCNet); `ready` once it can be attached and sent. `failed` when the
            transcode failed; `expired` when an unattached upload was cleaned up.
        checksum:
          type: [string, "null"]
          description: SHA-256 of the stored bytes, for deduplication.
        preview:
          type: [string, "null"]
          description: URL of a generated preview or thumbnail, when one exists.
        expires_at:
          oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]
          description: When an unattached upload is cleaned up.
        created_at: {$ref: "#/components/schemas/Timestamp"}

    Station:
      type: object
      required: [uucp_name, enabled]
      properties:
        uucp_name: {$ref: "#/components/schemas/UucpName"}
        alias: {type: [string, "null"]}
        display_name: {type: [string, "null"]}
        frequency_hz: {type: [integer, "null"], minimum: 0}
        mode: {oneOf: [$ref: "#/components/schemas/Mode", type: "null"]}
        enabled: {type: boolean}
        last_contact_at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]}
        synced_at: {$ref: "#/components/schemas/Timestamp"}
        latitude: {type: [number, "null"], description: "Last-known latitude, or null when unknown."}
        longitude: {type: [number, "null"], description: "Last-known longitude, or null when unknown."}
        altitude_m: {type: [number, "null"]}
        position_at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"], description: "When the last-known position was reported."}
        position_source: {type: [string, "null"], enum: [gps, manual, estimated], description: "Where the last-known position came from; null when unknown."}
    StationPatch:
      type: object
      properties:
        alias: {type: [string, "null"], pattern: "^[A-Za-z0-9_-]{1,32}$"}
        display_name: {type: [string, "null"], maxLength: 64}
        frequency_hz: {type: [integer, "null"], minimum: 0}
        mode: {oneOf: [$ref: "#/components/schemas/Mode", type: "null"]}
        enabled: {type: boolean}

    Schedule:
      type: object
      required: [id, title, start_time, end_time, enabled, stations]
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        start_time: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", description: "Station local time, HH:MM."}
        end_time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: An end before the start crosses midnight.
        enabled: {type: boolean}
        recurrence:
          type: object
          description: Which days the window repeats on; absent means every day.
          properties:
            byday:
              type: array
              uniqueItems: true
              description: Weekday codes; empty means every day.
              items: {type: string, enum: [MO, TU, WE, TH, FR, SA, SU]}
        transport: {$ref: "#/components/schemas/Transport"}
        stations:
          type: array
          items: {$ref: "#/components/schemas/UucpName"}
    ScheduleWrite:
      type: object
      properties:
        title: {type: string, maxLength: 64}
        start_time: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
        end_time: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
        enabled: {type: boolean}
        recurrence:
          type: object
          description: Which days the window repeats on; absent means every day.
          properties:
            byday:
              type: array
              uniqueItems: true
              description: Weekday codes; empty means every day.
              items: {type: string, enum: [MO, TU, WE, TH, FR, SA, SU]}
        transport:
          $ref: "#/components/schemas/Transport"
          description: Default `uucp`.
        stations:
          type: array
          items: {$ref: "#/components/schemas/UucpName"}
    ScheduleNext:
      type: object
      required: [schedule_id, starts_at, ends_at, stations]
      properties:
        schedule_id: {type: integer, format: int64}
        starts_at: {$ref: "#/components/schemas/Timestamp"}
        ends_at: {$ref: "#/components/schemas/Timestamp"}
        stations:
          type: array
          items: {$ref: "#/components/schemas/UucpName"}

    QueueJob:
      type: object
      required: [job_id, station, kind, size_bytes, queued_at]
      properties:
        job_id: {type: string}
        station: {$ref: "#/components/schemas/UucpName"}
        kind: {type: string, enum: [message, mail, gps, file, other]}
        size_bytes: {type: integer}
        queued_at: {$ref: "#/components/schemas/Timestamp"}
        message_id:
          type: [integer, "null"]
          format: int64
          description: The message this job carries, when it is one.
        mail_from: {type: [string, "null"], description: "For mail jobs."}

    RadioState:
      type: object
      required: [active_profile, tx, frequency_hz, mode, backend]
      properties:
        active_profile: {type: integer}
        tx: {type: boolean}
        frequency_hz: {type: integer}
        mode: {$ref: "#/components/schemas/Mode"}
        power: {type: integer, minimum: 0, maximum: 100, description: Percent.}
        swr: {type: [number, "null"]}
        fwd_w: {type: [number, "null"]}
        ref_w: {type: [number, "null"]}
        s_meter_db:
          type: [number, "null"]
          description: dB relative to S9; null when the rig gives no reading.
        protection: {type: boolean, description: High-SWR protection tripped.}
        digital_voice: {type: boolean}
        backend: {type: string, enum: [sbitx, hamlib, none]}
        rig_model: {type: [string, "null"], description: "Hamlib model name, e.g. IC-7100."}
    RadioProfile:
      type: object
      required: [profile, frequency_hz, mode]
      properties:
        profile: {type: integer}
        frequency_hz: {type: integer, minimum: 0}
        mode: {$ref: "#/components/schemas/Mode"}
        power: {type: integer, minimum: 0, maximum: 100}
        volume: {type: integer, minimum: 0, maximum: 100}
        filter_width_hz: {type: [integer, "null"]}
        digital_voice: {type: boolean}
    RadioProfilePatch:
      type: object
      properties:
        frequency_hz: {type: integer, minimum: 0}
        mode: {$ref: "#/components/schemas/Mode"}
        power: {type: integer, minimum: 0, maximum: 100}
        volume: {type: integer, minimum: 0, maximum: 100}
        filter_width_hz: {type: [integer, "null"]}
        digital_voice: {type: boolean}
    RadioSettings:
      type: object
      description: |
        Settings radiod keeps once for the station, not per profile.
      required: [default_profile, default_profile_fallback_s, step_hz, swr_limit, bfo_hz]
      properties:
        default_profile: {type: integer, minimum: 0}
        default_profile_fallback_s:
          type: [integer, "null"]
          minimum: 1
          description: |
            How long another profile stays active before the radio returns to
            `default_profile`; null never returns. radiod's
            `main:default_profile_fallback_timeout` (-1 there for null).
        step_hz: {type: integer, minimum: 1, description: The tuning step.}
        swr_limit:
          type: number
          minimum: 1.0
          multipleOf: 0.1
          description: |
            The SWR above which high-SWR protection trips, e.g. 2.5 for 2.5:1. radiod
            stores it as SWR × 10 (`main:reflected_threshold` = 25).
        bfo_hz:
          type: [integer, "null"]
          minimum: 0
          description: |
            The sBitx's beat-frequency oscillator, an absolute frequency in Hz
            (`main:bfo`, e.g. 40035000). null on Hamlib radios, which don't use it.
        tx_timeout_s:
          type: [integer, "null"]
          minimum: 10
          description: |
            The longest single transmission; after it the station unkeys and reports
            `tx_timeout`. null when the radio backend doesn't support one yet.
    RadioSettingsPatch:
      type: object
      properties:
        default_profile: {type: integer, minimum: 0}
        default_profile_fallback_s: {type: [integer, "null"], minimum: 1}
        step_hz: {type: integer, minimum: 1}
        swr_limit: {type: number, minimum: 1.0, multipleOf: 0.1}
        bfo_hz: {type: integer, minimum: 0, description: "sBitx only; refused (422) on Hamlib radios."}
        tx_timeout_s: {type: integer, minimum: 10, description: "Refused (422) while the radio has no transmit timeout (`tx_timeout_s` null)."}

    ModemStatus:
      type: object
      required: [link, direction, audio_ok]
      properties:
        link: {type: string, enum: [idle, listening, calling, connected, disconnecting]}
        my_call: {type: [string, "null"]}
        peer_call: {type: [string, "null"]}
        direction: {type: string, enum: [tx, rx, idle]}
        snr_db: {type: [number, "null"]}
        peer_snr_db: {type: [number, "null"]}
        bitrate_bps: {type: [integer, "null"]}
        bytes_tx: {type: integer}
        bytes_rx: {type: integer}
        tx_gain_db: {type: number}
        tx_peak_dbfs: {type: [number, "null"]}
        arq_tx_mode: {type: [string, "null"]}
        arq_rx_mode: {type: [string, "null"]}
        session_transport:
          oneOf: [$ref: "#/components/schemas/Transport", type: "null"]
          description: What the ARQ session in progress carries; null without one.
        listen_mode:
          oneOf: [$ref: "#/components/schemas/BroadcastMode", type: "null"]
          description: |
            What the modem decodes while no ARQ link is up, broadcasts included: the
            station's `modem.config.listen_mode`, except while radiod has switched it to send
            a broadcast in another mode.
        broadcast:
          type: object
          required: [state]
          description: |
            The broadcast plane. ARQ comes first: an ARQ session that starts stops a
            carousel on the air (`preempted`) until the link is idle again.
          properties:
            state: {type: string, enum: [idle, sending, preempted]}
            message_id:
              type: [integer, "null"]
              format: int64
              description: The broadcast message on the air or preempted; null for broadcast chat or when idle.
            mode: {oneOf: [$ref: "#/components/schemas/BroadcastMode", type: "null"]}
            cycle: {type: [integer, "null"], minimum: 1, description: "The pass of the carousel in progress, from 1."}
            cycles_total: {type: [integer, "null"]}
            frames_sent: {type: [integer, "null"]}
            frames_total: {type: [integer, "null"]}
        audio_ok: {type: boolean}
        audio_error: {type: [string, "null"]}
    ModemConfig:
      type: object
      description: |
        Mercury runs inside radiod, which owns the sound card and PTT, so they are not set
        here. A standalone Mercury keeps its own settings for them. Whether broadcasts are
        received and filed is `settings.broadcast.receive`.
      properties:
        tx_gain_db: {type: number, minimum: -20, maximum: 20}
        waterfall: {type: boolean}
        listen_mode:
          $ref: "#/components/schemas/BroadcastMode"
          description: |
            The mode the station listens in while no ARQ link is up, and sends its
            broadcasts in by default: one setting for receive and transmit. Mercury's
            broadcast chat (`modem.chat`, plane `broadcast`) uses it too. Default DATAC3.
    ModemConfigPatch:
      type: object
      description: Same fields as `ModemConfig`.
      properties:
        tx_gain_db: {type: number, minimum: -20, maximum: 20}
        waterfall: {type: boolean}
        listen_mode:
          $ref: "#/components/schemas/BroadcastMode"
          description: |
            The mode the station listens in while no ARQ link is up, and sends its
            broadcasts in by default: one setting for receive and transmit. Mercury's
            broadcast chat (`modem.chat`, plane `broadcast`) uses it too. Default DATAC3.

    System:
      type: object
      required: [hostname, uucp_name, versions, clock, memory, disk]
      properties:
        hostname: {type: string}
        uucp_name: {$ref: "#/components/schemas/UucpName"}
        callsign: {type: [string, "null"]}
        domain: {type: string, description: Mail domain of this station.}
        versions:
          type: object
          properties:
            backend: {type: string}
            mercury: {type: string}
            os: {type: string}
        clock:
          type: object
          required: [now]
          properties:
            now: {$ref: "#/components/schemas/Timestamp"}
            synchronized: {type: boolean}
            timezone: {type: string, example: America/Sao_Paulo}
        uptime_s: {type: integer}
        memory:
          type: object
          properties:
            total_bytes: {type: integer}
            available_bytes: {type: integer}
        disk:
          type: object
          properties:
            total_bytes: {type: integer}
            free_bytes: {type: integer}
        network:
          type: array
          items:
            type: object
            properties:
              interface: {type: string}
              addresses:
                type: array
                items: {type: string}
              ssid: {type: [string, "null"]}
              default_route: {type: boolean}
        services:
          type: object
          additionalProperties: {type: string, enum: [active, inactive, failed]}
          example: {uucp: active, postfix: active, gps: inactive}
    Settings:
      type: object
      properties:
        language:
          $ref: "#/components/schemas/Locale"
          description: The station default, for users without their own `locale`.
        allow_attachments_role: {$ref: "#/components/schemas/Role"}
        allow_messages_role: {$ref: "#/components/schemas/Role"}
        max_message_bytes: {type: integer}
        max_spool_bytes: {type: integer}
        forward_email: {type: [string, "null"], format: email}
        sos_recipients:
          type: array
          items: {$ref: "#/components/schemas/UucpName"}
        idle_logout_s: {type: integer, minimum: 60}
        encryption:
          type: object
          description: |
            Encryption on the air is not allowed on amateur bands. Turn these on only for a
            station licensed to use encryption. Admin only; all default to off.
          properties:
            messages:
              type: boolean
              default: false
              description: Allow passphrase-encrypted message bodies and attachments.
            dstar_voice:
              type: boolean
              default: false
              description: Allow D-STAR encrypted voice; otherwise the radio refuses to key with it on.
            reticulum:
              type: boolean
              default: false
              description: Allow Reticulum, which encrypts everything it sends, including over the air on backhaul links.
        webrtc:
          type: object
          description: Browser audio (`api-ws.yaml`, Audio).
          properties:
            max_sessions: {type: integer, minimum: 1, default: 4}
            udp_ports:
              type: object
              description: The UDP range WebRTC media uses, on the Wi-Fi interface only.
              properties:
                min: {type: integer, minimum: 1024, maximum: 65535, default: 50000}
                max: {type: integer, minimum: 1024, maximum: 65535, default: 50099}
        tx_rate_limit:
          type: object
          description: Per-user limits on making the station transmit.
          properties:
            digi_per_minute: {type: integer, minimum: 1, default: 6}
            ptt_per_minute: {type: integer, minimum: 1, default: 30}
            broadcasts_per_hour: {type: integer, minimum: 1, default: 6}
        broadcast:
          type: object
          description: radiod's messaging layer, which runs broadcasts.
          properties:
            receive:
              type: boolean
              default: true
              description: Decode broadcast messages heard in the listen mode and file them as incoming messages.

    LogLine:
      type: object
      required: [text]
      properties:
        ts: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]}
        text: {type: string}

    Wifi:
      type: object
      required: [ssid, enabled]
      properties:
        enabled: {type: boolean}
        ssid: {type: string, maxLength: 32}
        channel: {type: integer}
        mac_filter: {type: boolean}
        has_password: {type: boolean, readOnly: true}
    WifiPatch:
      type: object
      properties:
        enabled: {type: boolean}
        ssid: {type: string, maxLength: 32}
        channel: {type: integer}
        mac_filter: {type: boolean}
        password: {type: [string, "null"], minLength: 8, writeOnly: true, description: "null makes the network open."}

    Gps:
      type: object
      required: [fix, settings]
      properties:
        fix: {type: string, enum: [none, "2d", "3d"]}
        latitude: {type: [number, "null"]}
        longitude: {type: [number, "null"]}
        altitude_m: {type: [number, "null"]}
        at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"]}
        settings: {$ref: "#/components/schemas/GpsSettings"}
    GpsSettings:
      type: object
      properties:
        logging: {type: boolean}
        sample_interval_s: {type: integer, minimum: 1}
        file_period_s: {type: integer, minimum: 60}
        email: {type: [string, "null"], format: email}
        report:
          type: object
          description: Periodic position reports broadcast over the air so other stations can plot this one on the map.
          properties:
            enabled: {type: boolean, description: "Broadcast this station's position. Default off."}
            interval_s: {type: integer, minimum: 60, default: 900, description: "How often to report, in seconds."}
    GpsFile:
      type: object
      required: [name, size_bytes, created_at]
      properties:
        name: {type: string}
        size_bytes: {type: integer}
        created_at: {$ref: "#/components/schemas/Timestamp"}
    GpsPoint:
      type: object
      required: [at, latitude, longitude]
      properties:
        at: {$ref: "#/components/schemas/Timestamp"}
        latitude: {type: number}
        longitude: {type: number}
        altitude_m: {type: [number, "null"]}
        accuracy_m: {type: [number, "null"]}
    Trip:
      type: object
      required: [id, started_at]
      properties:
        id: {type: integer, format: int64}
        started_at: {$ref: "#/components/schemas/Timestamp"}
        ended_at: {oneOf: [$ref: "#/components/schemas/Timestamp", type: "null"], description: "Null while the trip is open."}
        point_count: {type: integer}

    Event:
      type: object
      required: [id, at, action]
      properties:
        id: {type: integer, format: int64}
        at: {$ref: "#/components/schemas/Timestamp"}
        user_id: {type: [integer, "null"], format: int64}
        action: {type: string, example: user.create}
        target: {type: [string, "null"], example: "user:12"}
        detail: {type: object, additionalProperties: true}
        old_value:
          type: [object, "null"]
          additionalProperties: true
          description: The value before the change, when recorded.
        new_value:
          type: [object, "null"]
          additionalProperties: true
          description: The value after the change, when recorded.
        ip: {type: [string, "null"]}

    Locale:
      type: string
      enum: [en, es, pt-BR, fr]
    SessionInfo:
      type: object
      required: [id, created_at, last_seen_at, expires_at, current]
      properties:
        id: {type: integer, format: int64}
        user_id: {type: integer, format: int64}
        created_at: {$ref: "#/components/schemas/Timestamp"}
        last_seen_at: {$ref: "#/components/schemas/Timestamp"}
        expires_at: {$ref: "#/components/schemas/Timestamp"}
        ip: {type: [string, "null"]}
        user_agent: {type: [string, "null"]}
        current: {type: boolean, description: The session making this request.}
    SetupStatus:
      type: object
      required: [done]
      properties:
        done: {type: boolean}
        uucp_name: {$ref: "#/components/schemas/UucpName"}
        domain: {type: string}
    SetupRequest:
      type: object
      required: [setup_code, station_name, admin, language, timezone]
      properties:
        setup_code:
          type: string
          writeOnly: true
          description: From the installer (console or `/etc/hermes/setup-code`); single use.
        station_name: {type: string, maxLength: 64}
        callsign: {type: [string, "null"], maxLength: 16}
        country: {type: [string, "null"], pattern: "^[A-Z]{2}$", description: ISO 3166-1 alpha-2.}
        language: {$ref: "#/components/schemas/Locale"}
        timezone: {type: string, example: America/Sao_Paulo}
        admin:
          type: object
          required: [username, password]
          properties:
            username: {type: string, pattern: "^[a-z0-9._-]{1,32}$"}
            display_name:
              type: [string, "null"]
              maxLength: 64
              description: Human name, optional; when null the UI shows the username.
            password: {type: string, minLength: 8, writeOnly: true}
        radio_profile:
          type: object
          properties:
            frequency_hz: {type: integer, minimum: 0}
            mode: {$ref: "#/components/schemas/Mode"}
        apps:
          type: array
          description: Apps to enable (ids from `GET /apps`).
          items: {type: string}
    App:
      type: object
      required: [id, name, path, version, enabled, min_role]
      properties:
        id: {type: string, example: hermes-chat}
        name: {type: string, example: Chat}
        description: {type: [string, "null"]}
        path: {type: string, example: /apps/chat/}
        icon: {type: [string, "null"], description: "Path to the app's icon."}
        version: {type: string}
        package: {type: [string, "null"], description: "Debian package that installs it."}
        enabled: {type: boolean}
        min_role: {$ref: "#/components/schemas/Role"}

    DigiMode:
      type: string
      enum: [FT8, CW, RTTY, DSTAR]
    DigiEntry:
      type: object
      required: [id, at, mode, dir, frequency_hz]
      properties:
        id: {type: integer, format: int64}
        at:
          $ref: "#/components/schemas/Timestamp"
          description: |
            When it happened. FT8 received: when the transmission started (the window's
            wall-clock start plus the decoder's time offset). CW and RTTY received: when the
            line ended. Sent: when it was keyed.
        mode: {$ref: "#/components/schemas/DigiMode"}
        dir: {type: string, enum: [rx, tx]}
        frequency_hz: {type: integer, description: Dial frequency.}
        offset_hz: {type: [integer, "null"], description: "Audio offset of the signal (FT8, RTTY)."}
        snr_db: {type: [number, "null"], description: "FT8: the decoder's SNR estimate (2.5 kHz bandwidth)."}
        dt_s: {type: [number, "null"], description: "FT8: start against 0.5 s into the UTC 15 s slot, as WSJT-X reports DT. HERMES stations send when a message is queued, so theirs is not near 0."}
        text:
          type: string
          maxLength: 512
          description: Decoded or sent text; empty for a D-STAR header. Untrusted when `dir` is `rx`.
        from: {type: [string, "null"], maxLength: 16, description: "Callsign, when the mode carries one. Not verified."}
        to: {type: [string, "null"], maxLength: 16, description: "FT8: the addressed callsign, CQ or null."}
        grid: {type: [string, "null"], pattern: "^[A-R]{2}[0-9]{2}([a-x]{2})?$", description: "FT8: Maidenhead locator, when sent."}
        user_id:
          type: [integer, "null"]
          format: int64
          description: For `tx`, the user who sent it.
        dstar:
          type: [object, "null"]
          description: D-STAR header, for `mode` = `DSTAR`.
          properties:
            mycall: {type: string, maxLength: 8}
            suffix: {type: string, maxLength: 4}
            urcall: {type: string, maxLength: 8}
            rpt1: {type: string, maxLength: 8}
            rpt2: {type: string, maxLength: 8}
            encrypted: {type: boolean}
            crc_ok: {type: boolean}
    DigiSettings:
      type: object
      properties:
        cw:
          type: object
          properties:
            wpm: {type: integer, minimum: 5, maximum: 60}
            pitch_hz: {type: integer, minimum: 300, maximum: 1200}
        rtty:
          type: object
          properties:
            baud: {type: integer, enum: [45, 50, 75], description: "45 is the standard 45.45 baud."}
            shift_hz: {type: integer, enum: [170, 425, 850]}
            mark_hz: {type: integer, minimum: 300, maximum: 3000}
        dstar:
          type: object
          properties:
            mycall: {type: string, maxLength: 8, description: "radiod's `dstar_mycall`."}
            encrypt: {type: boolean, description: Needs `settings.encryption.dstar_voice`.}
            denoise: {type: boolean}
            verbose: {type: boolean}
        voice_codec:
          type: string
          enum: [RADEV2, DSTAR]
          description: |
            The codec digital voice uses (radiod's `digital_voice_codec`). `DSTAR` needs the
            sBitx backend; refused while transmitting.
